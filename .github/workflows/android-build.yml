name: Android Build (TWA APK)

# Builds the android/ Trusted Web Activity wrapper around the live
# https://mawid-app-d1d03.web.app PWA. Runs here (not in the Claude Code
# sandbox that authored it) because that sandbox's network policy blocks
# dl.google.com, so the Android Gradle plugin / SDK can never be resolved
# there - GitHub-hosted runners have full internet access and the Android
# SDK preinstalled, so this is where the actual build has to happen.
#
# The debug APK always builds, with zero configuration, using Android's own
# auto-generated debug keystore - good enough to sideload for testing.
# The release APK only builds once the four ANDROID_KEYSTORE_* repo secrets
# below are set (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    - `base64 -w0 mawid-release.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    branches:
      - claude/mawid-clinic-booking-mvp-td9qxz
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # `secrets` isn't allowed directly inside step `if:` expressions, so
      # this job-level env (which IS allowed there) is the switch that
      # decides whether the release-signing steps below run.
      HAS_RELEASE_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mawid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        # -d -i (ignore-garbage) strips anything that isn't valid base64
        # (stray whitespace, \r from Windows line endings, a trailing
        # newline picked up during copy/paste into the GitHub secret) -
        # base64 -d alone failed twice in a row here with "invalid input"
        # even after the secret was reportedly re-copied, so this is
        # explicit defense against that instead of relying on a perfect
        # paste. Then verify the result actually looks like a keystore
        # (a real one starts with the ZIP magic bytes, since modern
        # keytool writes PKCS12) so a bad secret fails with a clear
        # message here rather than a confusing Gradle signing error later.
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d -i > app/release.keystore
          if [ ! -s app/release.keystore ] || ! head -c2 app/release.keystore | grep -q $'PK'; then
            echo "::error::Decoded release.keystore is empty or not a valid keystore file - ANDROID_KEYSTORE_BASE64 secret is likely wrong (re-run: base64 -w0 mawid-release.keystore and replace the secret value exactly, no surrounding quotes)."
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release APK
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        if: ${{ env.HAS_RELEASE_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mawid-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
