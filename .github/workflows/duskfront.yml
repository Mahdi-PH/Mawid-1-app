name: DUSKFRONT CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['duskfront/**', '.github/workflows/duskfront.yml']
  pull_request:
    paths: ['duskfront/**']

defaults:
  run:
    working-directory: duskfront

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duskfront/package-lock.json

      - run: npm ci
      - run: npm run build:shared
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/d?schema=public
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: duskfront/playwright-report/
          retention-days: 7
